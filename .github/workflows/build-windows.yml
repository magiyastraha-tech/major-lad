name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      # Правка маковской сборки не повод пересобирать Windows.
      - '.github/workflows/build-macos.yml'
      - 'MajorLad-Student-macos.spec'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Opus собираем здесь же: готовых DLL для Windows никто не раздаёт.
      # Если сборка не удалась — программа всё равно соберётся и будет
      # слать звук без сжатия.
      - name: Build Opus library
        continue-on-error: true
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git opus-src
          cmake -S opus-src -B opus-build -DOPUS_BUILD_SHARED_LIBRARY=ON -DOPUS_BUILD_TESTING=OFF -DOPUS_BUILD_PROGRAMS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build opus-build --config Release
          New-Item -ItemType Directory -Force -Path opus-lib | Out-Null
          $dll = Get-ChildItem -Path opus-build -Recurse -Filter opus.dll | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName opus-lib/opus.dll
            Write-Host "Opus собран: $($dll.FullName)"
          } else {
            Write-Host "opus.dll не найден, сборка пойдёт без кодека"
          }

      - name: Check Opus library
        id: opus
        shell: pwsh
        run: |
          if (Test-Path opus-lib/opus.dll) {
            'args=--add-binary "opus-lib/opus.dll;."' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "args=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build teacher exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name MajorLad-Teacher --collect-all sounddevice
          --collect-all rtmidi --collect-all cv2 --collect-all soundfile --collect-all PySide6.QtMultimedia --exclude-module tkinter
          ${{ steps.opus.outputs.args }}
          main_teacher.py

      - name: Build student exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name MajorLad-Student --collect-all sounddevice
          --collect-all rtmidi --collect-all cv2 --collect-all soundfile --collect-all PySide6.QtMultimedia --exclude-module tkinter
          ${{ steps.opus.outputs.args }}
          main_student.py

      # Расписание — отдельная программа, звук и MIDI ей не нужны.
      # Собираем под латинским именем, а в папку dist кладём под русским:
      # кириллица в пути сборки иногда ломает PyInstaller. Латинский файл
      # остаётся в dist намеренно: обновление программы ищет в релизе файл
      # ровно с этим именем (MajorLad-Schedule.exe).
      - name: Build schedule exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name MajorLad-Schedule --exclude-module tkinter schedule_main.py
          Copy-Item dist/MajorLad-Schedule.exe "dist/Мажорный лад Расписание.exe"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: major-lad-windows
          path: dist/*.exe
          if-no-files-found: error
