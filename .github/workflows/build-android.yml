name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build both flavors
        working-directory: android
        run: gradle assembleTeacherDebug assembleStudentDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          echo "Версия: $version"
          cp android/app/build/outputs/apk/teacher/debug/*.apk \
             "out/MajorLad-Teacher-$version.apk"
          cp android/app/build/outputs/apk/student/debug/*.apk \
             "out/MajorLad-Student-$version.apk"
          ls -l out

      - name: Upload teacher APK
        uses: actions/upload-artifact@v4
        with:
          name: major-lad-android-teacher
          path: out/MajorLad-Teacher-*.apk

      - name: Upload student APK
        uses: actions/upload-artifact@v4
        with:
          name: major-lad-android-student
          path: out/MajorLad-Student-*.apk
